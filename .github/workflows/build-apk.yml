
name: Build Mess APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          if [ -f "mess-android-wrapper-fixed.zip" ]; then
            unzip -q mess-android-wrapper-fixed.zip -d extracted
          elif [ -f "mess-android-wrapper.zip" ]; then
            unzip -q mess-android-wrapper.zip -d extracted
          else
            echo "ERROR: Android project ZIP not found."
            ls -la
            exit 1
          fi

          if [ ! -f "extracted/mess-android-wrapper/settings.gradle" ]; then
            echo "ERROR: settings.gradle not found after extraction."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: extracted/mess-android-wrapper
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mess-debug-APK
          path: extracted/mess-android-wrapper/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
